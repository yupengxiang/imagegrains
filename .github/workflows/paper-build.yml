name: Paper Build

on:
  push:
    branches: [main]
    paths:
      - 'docs/paper/**'
      - '.github/workflows/paper-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/paper/**'
  workflow_dispatch:

jobs:
  build-paper:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile full technical report
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_v2.tex
          working_directory: docs/paper
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Compile reviewer edition
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_submission.tex
          working_directory: docs/paper
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -file-line-error

      - name: Check LaTeX warnings
        working-directory: docs/paper
        run: |
          for stem in main_v2 main_submission; do
            echo "== ${stem}: undefined references / citations =="
            if grep -Ei 'undefined references|citation.*undefined|reference.*undefined' "${stem}.log"; then
              echo "${stem} has unresolved references or citations."
              exit 1
            fi
            echo "== ${stem}: overfull boxes =="
            grep -E 'Overfull \\hbox|Overfull \\vbox' "${stem}.log" || true
            echo "== ${stem}: page count =="
            grep -E 'Output written on .*\([0-9]+ pages' "${stem}.log" | tail -1 || true
          done

      - name: Upload full report PDF
        uses: actions/upload-artifact@v4
        with:
          name: technical-report-v2-pdf
          path: docs/paper/main_v2.pdf
          if-no-files-found: error

      - name: Upload reviewer edition PDF
        uses: actions/upload-artifact@v4
        with:
          name: technical-report-reviewer-pdf
          path: docs/paper/main_submission.pdf
          if-no-files-found: error
